/* ---------- block editing ---------- */

/* rendered text -> markdown offsets: walk both, skipping markdown syntax */

  sw=Math.max(1,Math.min(iw-sx,+sw||iw));sh=Math.max(1,Math.min(ih-sy,+sh||ih));
  tw=Math.max(1,Math.round(tw));th=Math.max(1,Math.round(th));

  document.body.appendChild(a);a.click();a.remove();

function handoff(blob,url){
  var file=null;
  try{file=new File([blob],fileTitle()+".pdf",{type:"application/pdf"})}catch(e){}
  var canShare=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));
  modal("<h3>PDF ready</h3><p>"+
    (canShare?"Share opens your device sheet &mdash; Print, AirDrop and Save all live there."
             :"Open shows the PDF in your device&rsquo;s viewer, where the print and share options live.")+"</p>"+
    "<div class='row'><button data-a='x'>Cancel</button><button data-a='dl'>Download</button>"+
    "<button class='primary' data-a='go'>"+(canShare?"Share":"Open")+"</button></div>",
    function(a){

        document.body.appendChild(el);el.click();el.remove()}
      if(a==="go"){
        if(canShare)navigator.share({files:[file],title:fileTitle()}).catch(function(){openBlob(url)});
        else openBlob(url);

    });
}
function printPdf(){
  commitOpen();
  toast("Preparing PDF\u2026");
  buildPdf().then(function(blob){
    hideToast();
    var url=URL.createObjectURL(blob);
    if(IOS){handoff(blob,url);return}
    var old=document.getElementById("printframe");if(old)old.remove();
    var f=document.createElement("iframe");
    f.id="printframe";f.setAttribute("aria-hidden","true");
    f.style.cssText="position:fixed;right:0;bottom:0;width:1px;height:1px;opacity:0;border:0;pointer-events:none";
    var done=false;
    f.onload=function(){
      if(done)return;done=true;
      setTimeout(function(){
        try{f.contentWindow.focus();f.contentWindow.print()}catch(e){handoff(blob,url)}
      },300);
    };
    f.src=url;
    document.body.appendChild(f);
    setTimeout(function(){if(!done){done=true;handoff(blob,url)}},5000);
    setTimeout(function(){URL.revokeObjectURL(url)},180000);
  }).catch(function(){hideToast();alert("Could not build the PDF.")});
}

    lh.setUint16(26,nb.length,true);
    parts.push(lh.buffer,nb,f.bytes);
    var ce=new DataView(new ArrayBuffer(46));
    ce.setUint32(0,0x02014b50,true);ce.setUint16(4,20,true);ce.setUint16(6,20,true);
    ce.setUint32(16,crc,true);ce.setUint32(20,sz,true);ce.setUint32(24,sz,true);
    ce.setUint16(28,nb.length,true);ce.setUint32(42,offset,true);
    central.push(ce.buffer,nb);
    offset+=30+nb.length+sz;
  });
  var cdSize=central.reduce(function(a,b){return a+(b.byteLength||b.length)},0);
  var end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);
  end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);
  return new Blob(parts.concat(central,[end.buffer]),{type:"application/zip"});
}
function exportZip(){
  commitOpen();
  var enc=new TextEncoder();
  var files=[{name:"document.md",bytes:enc.encode(S.md)}];
  Object.keys(S.assets).forEach(function(n){
    files.push({name:n,bytes:new Uint8Array(dataURIBytes(S.assets[n]))});
  });
  download(fileTitle()+"-source.zip",zipBlob(files));
}

/* ---------- drag & drop ---------- */
var dragDepth=0;
window.addEventListener("dragover",function(e){e.preventDefault()});
window.addEventListener("dragenter",function(e){e.preventDefault();dragDepth++;$("#drophint").hidden=false});
window.addEventListener("dragleave",function(){if(--dragDepth<=0){dragDepth=0;$("#drophint").hidden=true}});
window.addEventListener("drop",function(e){
  e.preventDefault();dragDepth=0;$("#drophint").hidden=true;
  var items=e.dataTransfer.items,entries=[];
  if(items&&items.length&&items[0].webkitGetAsEntry){
    for(var i=0;i<items.length;i++){var en=items[i].webkitGetAsEntry();if(en)entries.push(en)}
    walkEntries(entries).then(function(files){routeDropped(files)});
  }else{
    routeDropped([].slice.call(e.dataTransfer.files));
  }
});
function walkEntries(entries){
  var out=[];
  function walk(en){
    return new Promise(function(res){
      if(en.isFile)en.file(function(f){out.push(f);res()},res);
      else if(en.isDirectory){
        var r=en.createReader();
        r.readEntries(function(list){Promise.all(list.map(walk)).then(res)},res);
      }else res();
    });
  }
  return Promise.all(entries.map(walk)).then(function(){return out});
}
function routeDropped(files){
  var zip=files.find(function(f){return /\.zip$/i.test(f.name)});
  if(zip)return openZip(zip);
  var manu=files.find(function(f){return /\.(manu|html?)$/i.test(f.name)});
  if(manu){var r=new FileReader();r.onload=function(){importManu(r.result)};r.readAsText(manu);return}
  var md=files.find(function(f){return /\.(md|markdown)$/i.test(f.name)});
  var imgs=files.filter(function(f){return /^image\//.test(f.type)});
  if(md){
    var rd=new FileReader();
    rd.onload=function(){
      S.md=rd.result.replace(/^\n+|\n+$/g,"");S.assets={};
      if(imgs.length)addImageAssetsOnly(imgs);else{S.dirty=true;render()}
    };
    rd.readAsText(md);
  }else if(imgs.length)addImageFiles(imgs,null);
}
function addImageAssetsOnly(files){
  var done=0;
  files.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(){S.assets[safeName(f.name)]=rd.result;if(++done===files.length){S.dirty=true;render()}};
    rd.readAsDataURL(f);
  });
}

markNoTranslate();
loadSelf();
applyView();
render();
fontsP=loadFonts().then(function(){render()});
