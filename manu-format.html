# .manu format

A .manu file is like PDF but is always editable. It is both the **content** and the content’s **editor**. Base file being under 333KB in size.

This webpage is a .manu file. Just double-click here to edit this text block.

- Markdown
- Embedded images
- Embedded fonts
- Always editable
- All in the same file

Works in **offline**, too. And outputs beautiful **printable PDF** out of the box if you want one.

Press Ctrl+S to save this page, and give it a shot.

  --mono:'Manu Mono',ui-monospace,Menlo,Consolas,monospace;
  --body-font:var(--serif); --heading-font:var(--sans);
}
:root[data-body="modern"]{--body-font:var(--sans)}
:root[data-heading="book"]{--heading-font:var(--serif)}
*{box-sizing:border-box}
html{background:var(--desk);-webkit-text-size-adjust:none;text-size-adjust:none}
body{margin:0;background:var(--desk);font-family:var(--sans);color:var(--txt)}

/* ---------- island ---------- */
:root{--barh:0px}
#island{position:fixed;z-index:50;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:13px;background:var(--accent);
  box-shadow:0 2px 6px rgba(0,0,0,.22),0 8px 22px rgba(0,0,0,.2);
  transition:opacity .4s;touch-action:manipulation}
.ib{appearance:none;border:0;background:transparent;color:#fff;width:36px;height:36px;padding:0;
  border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ibrow{display:flex;gap:2px;justify-content:center}
#brand{appearance:none;border:0;background:transparent;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:5px 6px 4px;border-radius:9px;color:#fff;font-family:var(--sans);font-size:13px;font-weight:700;
  letter-spacing:.16em;cursor:pointer;user-select:none;-webkit-user-select:none}
#brand:hover{background:rgba(255,255,255,.2)}
#brand:focus-visible{outline:2px solid #fff;outline-offset:-2px}
#brand svg{width:17px;height:17px;flex:0 0 auto;pointer-events:none}
#brand .mk-t{fill:#fff;stroke:#fff;stroke-width:13;stroke-linejoin:round}
#brand .mk-m{fill:none;stroke:var(--accent);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:rgba(255,255,255,.2)}
.ib:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ib .ic-exit,body.full .ib .ic-full{display:none}
body.full .ib .ic-exit{display:block}
@media(pointer:coarse){.ib{width:42px;height:42px}}
@media(max-width:880px){:root{--barh:30px}}
/* fullscreen preview: the chrome fades while the pointer rests */
body.full #pdfbar{transition:opacity .4s}
body.full.idle #island,body.full.idle #pdfbar{opacity:0;pointer-events:none}
body.full.idle,body.full.idle *{cursor:none!important}
.pop.menu{max-height:calc(100vh - 76px);overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--chrome2) transparent}
.pop .menuitem kbd{float:right;font-family:var(--sans);font-size:11px;color:var(--txt-dim);margin-left:18px}

/* ---------- desk & sheet ---------- */
#desk{padding:calc(var(--barh,54px) + 30px) 24px 90px;display:block;overflow-x:auto;touch-action:pan-x pan-y}
#sheetwrap,#sheet,.page,.blk{touch-action:pan-x pan-y}
#sheetwrap{position:relative;width:210mm;margin:0 auto}
#app #sheetwrap{display:block}
body[data-view="pages"] #app #sheetwrap{display:none}
body[data-view="digital"] #sheetwrap{width:min(100%,760px)}
html[data-view="digital"],html[data-view="digital"] body{background:var(--paper)}
body[data-view="digital"] .crop,body[data-view="digital"] .a4tag{display:none}
.crop{position:absolute;width:14px;height:14px;pointer-events:none;color:#5a6170}
.crop::before,.crop::after{content:"";position:absolute;background:currentColor}
.crop::before{width:14px;height:1px}.crop::after{width:1px;height:14px}
.crop.tl{left:-20px;top:-20px}.crop.tl::before{bottom:0}.crop.tl::after{right:0}
.crop.tr{right:-20px;top:-20px}.crop.tr::before{bottom:0}.crop.tr::after{left:0}
.crop.bl{left:-20px;bottom:-20px}.crop.bl::before{top:0}.crop.bl::after{right:0}
.crop.br{right:-20px;bottom:-20px}.crop.br::before{top:0}.crop.br::after{left:0}
#sheet{position:relative;color:var(--ink);font-family:var(--body-font);font-size:11.5pt;line-height:1.55;
  font-synthesis:none;-webkit-font-synthesis:none;font-kerning:none;font-variant-ligatures:none}
#sheet code,#sheet pre{font-weight:400;font-style:normal}
body[data-view="digital"] #sheet{background:var(--paper);min-height:60vh;padding:20mm;
  font-size:17px;line-height:1.65;box-shadow:none}
body[data-view="pages"] .page{position:relative;height:297mm;overflow:hidden;background:var(--paper);
  padding:20mm;margin:0 0 34px;
  box-shadow:0 1px 2px rgba(0,0,0,.35),0 14px 44px rgba(0,0,0,.4)}
.pagenum{position:absolute;bottom:7mm;right:9mm;font-family:var(--sans);font-size:9px;
  letter-spacing:.14em;color:#b6b0a0;user-select:none}
body.editing[data-view="digital"] #sheet{min-height:70vh}
/* Preview is the PDF itself */
body[data-view="pages"] #desk{padding:0;overflow:hidden}
#pdfview{position:relative;width:100%;height:100vh;background:#3a3f4a;overflow:hidden}
#pdfview[hidden]{display:none}
#pvscroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;background:#3a3f4a;overscroll-behavior:contain;cursor:grab}
#pvscroll:active{cursor:grabbing}
#pvpages{display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px;min-width:min-content}
.pvpage{position:relative;flex:0 0 auto;background:#fffefa;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.pvpage canvas{display:block;width:100%;height:100%}
.pvlink{position:absolute;z-index:2;display:block;background:transparent;border-radius:2px;cursor:pointer}
.pvlink:hover{background:rgba(80,110,180,.08)}
.pvlink:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pdfbtn.zoom{padding:9px 12px;font-size:15px;letter-spacing:0;min-width:38px}
#pdfzoom{font-size:11px;letter-spacing:.08em;min-width:34px;display:inline-block;text-align:center}
#pdfbar{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;display:flex;gap:8px;align-items:center;
  background:rgba(24,27,33,.94);border:1px solid var(--chrome2);border-radius:999px;padding:6px 6px 6px 15px;
  box-shadow:0 8px 26px rgba(0,0,0,.5)}
#pdfstat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-dim);white-space:nowrap}
.pdfbtn{appearance:none;border:0;border-radius:999px;background:var(--chrome2);color:var(--txt);
  font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 15px;cursor:pointer;min-height:36px;white-space:nowrap}
.pdfbtn.primary{background:var(--accent);color:#fff}
/* structural blocks: page break, spacer, rule */
body[data-view="digital"] .blk.pbreak{margin:.5em 0;padding:2.2em 0}
body[data-view="digital"] .blk.rule{padding:1.3em 0}
.sp{display:flex;align-items:center;justify-content:center;border:1px dashed transparent;border-radius:3px;
  color:transparent;font-family:var(--sans);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  user-select:none;pointer-events:none;transition:border-color .12s,color .12s}
body[data-mode="edit"] .blk:hover .sp{border-color:#eae5d6}
body[data-mode="edit"] .blk.sel .sp{border-color:#ded9cb;color:#b6b0a0}
.delb{position:absolute;right:-12px;top:-12px;width:24px;height:24px;border-radius:50%;
  border:1px solid #ded9cb;background:var(--paper);color:#a8604f;font-family:var(--sans);font-size:14px;
  line-height:1;padding:0;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:4;
  box-shadow:0 1px 4px rgba(0,0,0,.14)}
.delb:hover{background:var(--accent);border-color:var(--accent);color:#fff}
body[data-mode="edit"] .blk.sel>.delb{display:flex}
@media(pointer:coarse){.delb{width:30px;height:30px;font-size:17px;right:-15px;top:-15px}}
.pb{display:flex;align-items:center;gap:10px;color:#b6b0a0;font-family:var(--sans);
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;user-select:none;pointer-events:none}
.pb::before,.pb::after{content:"";flex:1;border-top:1px dashed #d8d3c4}
body[data-view="pages"] .blk.pbreak{display:none}
.a4tag{position:absolute;top:-21px;right:2px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:#5a6170;user-select:none}
@media(max-width:880px){
  #desk{padding-left:12px;padding-right:12px;padding-bottom:80px}
  body[data-view="digital"] #sheet{padding:8vw 6.5vw;min-height:70vh}
  body[data-mode="edit"][data-view="digital"] #sheet{padding-left:max(6.5vw,40px)}
}

/* ---------- document typography ---------- */
#sheet h1,#sheet h2,#sheet h3,#sheet h4{font-family:var(--heading-font);line-height:1.2;
  margin:1.35em 0 .45em;letter-spacing:-.01em}
#sheet h1{font-size:1.65em;margin-top:.15em;text-align:center}
#sheet h2{font-size:1.26em}
#sheet h3{font-size:1.09em}
#sheet h4{font-size:.96em;text-transform:uppercase;letter-spacing:.08em}
#sheet p{margin:.55em 0}
#sheet ul,#sheet ol{margin:.55em 0;padding-left:1.4em}
#sheet li{margin:.22em 0}
#sheet blockquote{margin:.8em 0;padding:.1em 0 .1em 1em;border-left:3px solid var(--rule);color:#4a4e55}
#sheet hr{border:0;border-top:1px solid var(--rule);margin:1.6em 0}
#sheet code{font-family:var(--mono);font-size:.86em;background:#f2f0e9;padding:.1em .35em;border-radius:3px}
#sheet pre{background:#f6f4ee;border:1px solid var(--rule);border-radius:6px;padding:.8em 1em;overflow-x:auto}
#sheet pre code{background:none;padding:0}
#sheet a{color:inherit;text-decoration:underline;text-decoration-color:#b9b4a6}
#sheet .img{display:block;max-width:100%;margin:.8em auto;position:relative;overflow:hidden}
#sheet .img img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:auto}
/* neighbouring pictures that fit on one line share it (see layoutRows) */
.blk.inrow{display:inline-block;vertical-align:middle}
.blk.inrow .img{max-width:none}
#sheet .img>canvas.hq-img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:1}
#sheet .img.hq-ready>img{opacity:0}
#sheet .img.transforming{outline:2px solid var(--accent);outline-offset:2px;cursor:grab;
  touch-action:none;user-select:none;-webkit-user-select:none;z-index:4}
#sheet .img.transforming:active{cursor:grabbing}
.tf-grid{position:absolute;inset:0;z-index:2;pointer-events:none;background:
  linear-gradient(to right,transparent 33.1%,rgba(255,255,255,.72) 33.2%,rgba(255,255,255,.72) 33.55%,transparent 33.65%,transparent 66.3%,rgba(255,255,255,.72) 66.4%,rgba(255,255,255,.72) 66.75%,transparent 66.85%),
  linear-gradient(to bottom,transparent 33.1%,rgba(255,255,255,.72) 33.2%,rgba(255,255,255,.72) 33.55%,transparent 33.65%,transparent 66.3%,rgba(255,255,255,.72) 66.4%,rgba(255,255,255,.72) 66.75%,transparent 66.85%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),inset 0 0 0 9999px rgba(0,0,0,.035)}
.tf-hint{position:absolute;left:10px;top:9px;z-index:4;pointer-events:none;padding:5px 8px;border-radius:999px;
  background:rgba(24,28,34,.72);color:#fff;font:10px/1.2 var(--sans);letter-spacing:.04em;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.tf-handle{position:absolute;right:7px;bottom:7px;width:26px;height:26px;border-radius:7px;
  background:var(--accent);border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.5);cursor:nwse-resize;touch-action:none;z-index:6}
.tf-handle::before{content:"";position:absolute;right:5px;bottom:5px;width:9px;height:9px;border-right:2px solid #fff;border-bottom:2px solid #fff}
/* the crop controls sit below the picture, never on it (placed by startTransform) */
.tf-bar{position:absolute;z-index:8;width:max-content;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding:7px;border-radius:12px;background:rgba(35,40,48,.94);box-shadow:0 4px 16px rgba(0,0,0,.42);
  cursor:default;user-select:none;-webkit-user-select:none}
.tf-bar button,.tf-bar select{appearance:none;border:0;border-radius:999px;background:var(--accent);color:#fff;
  font-family:var(--sans);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 12px;min-height:34px;cursor:pointer;touch-action:manipulation}
.tf-bar select{background:#4a5260;text-transform:none;letter-spacing:.02em;max-width:118px}
.tf-bar button.secondary{background:#4a5260}.tf-bar button.z{font-size:17px;letter-spacing:0;padding:6px 11px;background:#4a5260}
.tf-bar button:hover,.tf-bar select:hover{filter:brightness(1.12)}
.tf-zoom{appearance:none;min-width:90px;flex:1 1 120px;height:28px;background:transparent;touch-action:none}
.tf-zoom::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:rgba(255,255,255,.35)}
.tf-zoom::-webkit-slider-thumb{appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.tf-zoom::-moz-range-track{height:4px;border-radius:999px;background:rgba(255,255,255,.35)}
.tf-zoom::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
@media(max-width:620px){.tf-hint{display:none}.tf-bar{gap:4px;padding:5px}.tf-bar button,.tf-bar select{min-height:30px;padding:6px 9px}.tf-zoom{min-width:72px}}

#sheet .img.placeholder{border:1.5px dashed #c9c4b4;border-radius:4px;min-height:30mm;
  display:flex;align-items:center;justify-content:center;color:#a09a88;font-family:var(--sans);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer}

/* ---------- editing ---------- */
.blk{position:relative;border-radius:3px}
body[data-mode="edit"] .blk{cursor:text}
body[data-mode="edit"] .blk:hover{background:rgba(224,78,54,.045)}
.grip{position:absolute;left:-34px;top:0;width:30px;height:30px;display:none;align-items:center;justify-content:center;
  color:#b9b3a3;font-family:var(--sans);font-size:15px;line-height:1;border-radius:7px;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  zoom:var(--invz,1)}
.grip::after{content:"";position:absolute;inset:-8px}
body[data-mode="edit"] .blk.sel .grip{display:flex}
.grip:active{cursor:grabbing}
.blk.sel{background:rgba(224,78,54,.06)}
.addb{position:absolute;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;
  border:1px solid #ded9cb;background:var(--paper);color:#a8604f;font-family:var(--sans);font-size:16px;
  line-height:1;padding:0;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:3;
  box-shadow:0 1px 4px rgba(0,0,0,.14)}
.addb.top{top:-12px}.addb.bot{bottom:-12px}
.addb:hover{border-color:var(--accent);color:var(--accent)}
body[data-mode="edit"] .blk.sel>.addb{display:flex}
@media(pointer:coarse){.addb{width:30px;height:30px;font-size:19px}.addb.top{top:-15px}.addb.bot{bottom:-15px}}
@media(pointer:coarse){
  .grip{width:40px;height:40px;left:-42px;font-size:20px;background:rgba(36,39,44,.06)}
}
.blk.dragging{opacity:.35;pointer-events:none}
body.dragging,body.dragging *{user-select:none;-webkit-user-select:none}
#dropind{position:fixed;height:3px;background:var(--accent);border-radius:3px;z-index:65;pointer-events:none;
  box-shadow:0 1px 6px rgba(224,78,54,.45);
  transition:top .09s ease-out,left .12s ease-out,width .12s ease-out,opacity .12s}
#dropind::before{content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);
  width:9px;height:9px;border-radius:50%;background:var(--accent)}
@media(pointer:coarse){#dropind{height:4px}#dropind::before{width:11px;height:11px;left:-11px}}
#sheet textarea{display:block;width:100%;border:0;border-left:3px solid var(--accent);border-radius:0;
  text-transform:none;letter-spacing:normal;
  background:rgba(224,78,54,.05);color:var(--ink);font-family:var(--mono);font-size:max(10.5pt,calc(13px*var(--invz,1)));line-height:1.55;
  padding:.5em .7em;margin:.3em 0;resize:none;outline:none;overflow:hidden}
@media(max-width:520px){#sheet textarea{font-size:max(16px,calc(16px*var(--invz,1)))}}
#ghost{margin-top:1.2em;padding:.6em 0;color:#b6b0a0;font-family:var(--sans);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;cursor:text;user-select:none}
body[data-mode="view"] #ghost{display:none}

/* ---------- popovers & modal ---------- */
.pop{position:absolute;z-index:60;background:var(--chrome);border:1px solid var(--chrome2);border-radius:10px;
  box-shadow:0 12px 34px rgba(0,0,0,.5);padding:10px;min-width:210px;color:var(--txt);font-size:13px}
.pop h5{margin:2px 0 8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-dim);font-weight:600}
.pop .row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.pop button{appearance:none;border:1px solid var(--chrome2);background:transparent;color:var(--txt);
  font-family:var(--sans);font-size:12px;padding:7px 11px;border-radius:6px;cursor:pointer;min-height:34px}
.pop button:hover{background:var(--chrome2)}
.pop button[aria-pressed="true"]{border-color:var(--accent);color:var(--paper)}
.pop button.danger{color:#ff9c8b}
.pop input[type=number]{width:70px;background:var(--edge);border:1px solid var(--chrome2);color:var(--txt);
  border-radius:6px;padding:7px 8px;font-size:13px}
.pop .menuitem{display:block;width:100%;text-align:left;border:0;margin:1px 0}
.pop .sep{border-top:1px solid var(--chrome2);margin:7px -10px}
.pop .hint{font-size:11px;line-height:1.4;color:var(--txt-dim);padding:3px 4px 2px;max-width:215px}
#veil{position:fixed;inset:0;z-index:70;background:rgba(15,17,22,.6);display:flex;align-items:center;justify-content:center;padding:20px}
#veil[hidden]{display:none}
#modal{background:var(--chrome);border:1px solid var(--chrome2);border-radius:14px;max-width:440px;width:100%;
  padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
#modal h3{margin:0 0 10px;font-family:var(--serif);font-size:19px;color:var(--paper)}
#modal p{margin:8px 0;font-size:14px;line-height:1.5;color:var(--txt)}
#modal a{color:var(--paper);text-underline-offset:2px;word-break:break-all}
#modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#modal .optrow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;
  text-align:left;margin:9px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--chrome2);
  background:transparent;color:var(--txt);cursor:pointer;font-family:var(--sans);font-size:13px}
#modal .optrow:hover{background:var(--chrome2);border-color:#4a5260}
#modal .optrow em{display:block;font-style:normal;color:var(--txt-dim);font-size:11.5px;margin-top:4px;line-height:1.4}
#modal .optrow b{font-weight:600;white-space:nowrap;font-size:13px;color:var(--paper)}
#modal .optrow.busy b{color:var(--txt-dim);font-weight:400}
#modal button{appearance:none;border:1px solid var(--chrome2);background:transparent;color:var(--txt);
  padding:10px 16px;border-radius:8px;font-size:13px;cursor:pointer}
#modal button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#modal textarea{width:100%;height:50vh;background:var(--edge);color:var(--txt);border:1px solid var(--chrome2);
  border-radius:8px;font-family:var(--mono);font-size:12px;line-height:1.5;padding:10px;resize:vertical}
@media(max-width:520px){#modal textarea{font-size:16px}.pop input[type=number]{font-size:16px;width:84px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom));z-index:75;
  display:flex;align-items:center;gap:10px;background:rgba(22,25,31,.96);
  border:1px solid var(--chrome2);border-radius:999px;padding:9px 9px 9px 18px;
  box-shadow:0 12px 34px rgba(0,0,0,.55);color:var(--txt);font-family:var(--sans);font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .16s;max-width:calc(100vw - 24px)}
#toast.on{opacity:1;pointer-events:auto}
#toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast button{appearance:none;border:0;border-radius:999px;background:var(--accent);color:#fff;
  font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 16px;min-height:38px;cursor:pointer;flex:0 0 auto}
@media print{#toast{display:none!important}}
#drophint{position:fixed;inset:10px;z-index:80;border:2px dashed var(--accent);border-radius:14px;
  background:rgba(37,42,51,.85);display:flex;align-items:center;justify-content:center;
  color:var(--paper);font-size:15px;letter-spacing:.06em;pointer-events:none}
#drophint[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.pop{animation:pin .12s ease-out}@keyframes pin{from{opacity:0;transform:translateY(-3px)}to{opacity:1}}}

/* ---------- print ---------- */

<script id="manu-app">
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var S={md:"",blocks:[],assets:{},settings:{body:"book",heading:"modern",view:"digital"},mode:"edit",dirty:false,pages:1};

/* ---------- load from own DOM ---------- */
function unesc(t){return t.replace(/<\\\/script/gi,"<\/script")}
function esc4save(t){return t.replace(/<\/script/gi,"<\\/script")}
function markNoTranslate(){
  var h=document.documentElement;

  h.setAttribute("translate","no");

function loadSelf(){
  var src=$('script[type="text/manu"]');
  S.md=src?unesc(src.textContent).replace(/^\n+|\n+$/g,""):"";
  try{S.assets=JSON.parse($("#manu-assets").textContent||"{}")}catch(e){S.assets={}}
  try{S.settings=Object.assign(S.settings,JSON.parse($("#manu-settings").textContent||"{}"))}catch(e){}

}
function applyFonts(){
  document.documentElement.setAttribute("data-body",S.settings.body);
  document.documentElement.setAttribute("data-heading",S.settings.heading);
}
function applyView(){
  var v=S.settings.view;
  document.body.setAttribute("data-view",v);
  document.documentElement.setAttribute("data-view",v);
  S.mode=v==="digital"?"edit":"view";

  document.body.setAttribute("data-mode",S.mode);

/* ---------- markdown ---------- */
function hesc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function hrefDecode(s){
  return String(s||"").replace(/&amp;/g,"&").replace(/&quot;/g,'"')
    .replace(/&#(?:39|x27);/gi,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">");

function safeLinkHref(s){
  var u=hrefDecode(s).trim(),m;
  if(!u||/[\u0000-\u001F\u007F]/.test(u))return "";
  m=u.match(/^([a-z][a-z0-9+.-]*):/i);
  if(m&&!/^(https?|mailto|tel)$/i.test(m[1]))return "";
  return u;
}
function linkHtml(label,href){
  var u=safeLinkHref(href);
  return u?'<a href="'+hesc(u)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>':label;
}
function splitBlocks(md){
  var lines=md.split("\n"),out=[],cur=[],fence=false,i,l;
  for(i=0;i<lines.length;i++){l=lines[i];
    if(/^```/.test(l))fence=!fence;
    if(!fence&&/^\s*$/.test(l)){if(cur.length){out.push(cur.join("\n"));cur=[]}}
    else cur.push(l);
  }
  if(cur.length)out.push(cur.join("\n"));
  return out;
}
function parseAttrs(a){
  var o={},m,re=/([a-zA-Z]+)\s*=\s*([\w.%-]+)/g;
  while((m=re.exec(a||"")))o[m[1]]=m[2];
  return o;
}
function inline(s){
  var codes=[];
  s=s.replace(/`([^`]+)`/g,function(_,c){codes.push(c);return "\u0001"+(codes.length-1)+"\u0001"});
  s=hesc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)(\{([^}]*)\})?/g,function(_,alt,src,__,attrs){
    return imgHtml(alt,src,parseAttrs(attrs));
  });
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(_,label,href){return linkHtml(label,href)});
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  s=s.replace(/\u0001(\d+)\u0001/g,function(_,i){return "<code>"+hesc(codes[+i])+"</code>"});
  return s;
}
/* ---------- svg ---------- */
/* An SVG is only as good as its header: without a size it has no natural
   dimensions (and will not draw to a canvas at all in some browsers), and
   without a viewBox it cannot be scaled. Both are filled in here, on the way
   to the page - the stored asset stays exactly as it was imported. */
var SVGFIX=new Map();
function isSvg(u){return /^data:image\/svg\+xml/i.test(u||"")}
function svgLen(v){
  var m=/^\s*([0-9.eE+-]+)\s*(px|pt|pc|mm|cm|in|)\s*$/.exec(v||"");
  if(!m)return 0;
  var n=parseFloat(m[1])*{"":1,px:1,pt:96/72,pc:16,mm:96/25.4,cm:96/2.54,"in":96}[m[2]];
  return n>0&&isFinite(n)?n:0;
}
function svgFix(u){
  if(!isSvg(u))return u;
  var hit=SVGFIX.get(u);if(hit)return hit;
  var out=u;
  try{
    var c=u.indexOf(","),txt=/;base64/i.test(u.slice(0,c))
      ?new TextDecoder().decode(new Uint8Array(dataURIBytes(u)))
      :decodeURIComponent(u.slice(c+1));
    var doc=new DOMParser().parseFromString(txt,"image/svg+xml"),r=doc.documentElement;
    if(r&&r.localName==="svg"&&!doc.getElementsByTagName("parsererror").length){
      var w=svgLen(r.getAttribute("width")),h=svgLen(r.getAttribute("height"));
      var vb=(r.getAttribute("viewBox")||"").trim().split(/[\s,]+/).map(parseFloat);
      var hasVb=vb.length===4&&vb[2]>0&&vb[3]>0,changed=false;
      if(!hasVb&&w&&h){r.setAttribute("viewBox","0 0 "+w+" "+h);changed=true}
      else if(hasVb&&(!w||!h)){
        if(w)h=w*vb[3]/vb[2];
        else if(h)w=h*vb[2]/vb[3];
        else{w=1000;h=1000*vb[3]/vb[2]}      /* no size of its own: let it fill the column */
        r.setAttribute("width",+w.toFixed(3));r.setAttribute("height",+h.toFixed(3));changed=true;
      }
      if(changed)out="data:image/svg+xml;base64,"+
        b64(new TextEncoder().encode(new XMLSerializer().serializeToString(r)).buffer);
    }
  }catch(e){}
  SVGFIX.set(u,out);
  return out;
}
var IMG_MIN_W=20,IMG_MAX_W=170;          /* mm */
function clampImgW(w){
  w=parseFloat(w);
  return isFinite(w)&&w>0?Math.min(IMG_MAX_W,Math.max(IMG_MIN_W,w)):0;
}
function imgHtml(alt,src,at){
  var st="",fit=at.fit||"cover";
  /* a picture is never drawn narrower than the minimum, whatever the source says */
  if(at.w)st+="width:"+Math.max(IMG_MIN_W,parseFloat(at.w)||IMG_MIN_W)+"mm;";
  if(at.h)st+="height:"+parseFloat(at.h)+"mm;";
  var al=(at.align||"").toLowerCase();
  if(al==="left")st+="margin-left:0;margin-right:auto;";
  else if(al==="right")st+="margin-left:auto;margin-right:0;";
  var data=svgFix(S.assets[src]);
  var attrsStr=hesc(JSON.stringify(at));
  var pos=(at.x!=null||at.y!=null)?";object-position:"+(parseFloat(at.x)||50)+"% "+(parseFloat(at.y)||50)+"%":"";
  var zm=Math.max(1,parseFloat(at.z)||1);
  if(zm>1.005&&at.h)
    pos+=";width:"+(zm*100).toFixed(2)+"%;height:"+(zm*100).toFixed(2)+"%;position:absolute;left:"+
      (-(zm-1)/2*100).toFixed(2)+"%;top:"+(-(zm-1)/2*100).toFixed(2)+"%";
  if(!data&&!/^(https?:|data:)/.test(src))
    return '<span class="img placeholder" style="'+st+'" data-name="'+hesc(src)+'" data-at="'+attrsStr+'">'+hesc(alt||src)+" &middot; tap to add image</span>";
  return '<span class="img" style="'+st+'" data-name="'+hesc(src)+'" data-at="'+attrsStr+'">'+
    '<img src="'+hesc(data||src)+'" alt="'+hesc(alt)+'" style="object-fit:'+fit+pos+'"></span>';
}
function renderBlock(b){
  if(/^```/.test(b)){
    var body=b.replace(/^```[^\n]*\n?/,"").replace(/\n?```\s*$/,"");
    return "<pre><code>"+hesc(body)+"</code></pre>";
  }
  var lines=b.split("\n"),html="",list=null,i,l,m;
  function closeList(){if(list){html+="</"+list+">";list=null}}
  for(i=0;i<lines.length;i++){l=lines[i];
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){closeList();html+="<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">"}
    else if(/^(-{3,}|\*{3,})\s*$/.test(l)){closeList();html+="<hr>"}
    else if((m=l.match(/^\s*[-*]\s+(.*)$/))){if(list!=="ul"){closeList();html+="<ul>";list="ul"}html+="<li>"+inline(m[1])+"</li>"}
    else if((m=l.match(/^\s*\d+\.\s+(.*)$/))){if(list!=="ol"){closeList();html+="<ol>";list="ol"}html+="<li>"+inline(m[1])+"</li>"}
    else if((m=l.match(/^>\s?(.*)$/))){closeList();html+="<blockquote><p>"+inline(m[1])+"</p></blockquote>"}
    else{closeList();html+="<p>"+inline(l)+"</p>"}
  }
  closeList();
  return html;
}
function blockKind(b){
  if(/^\s*\\(pagebreak|newpage)\s*$/.test(b))return "pbreak";
  if(/^\s*\\(spacer|vspace)\b[^\n]*$/.test(b))return "spacer";
  if(/^\s*(-{3,}|\*{3,})\s*$/.test(b))return "rule";
  if(/^\s*!\[[^\]]*\]\([^)\s]*\)(\{[^}]*\})?\s*$/.test(b))return "imgblk";
  return "";
}
function spacerMm(b){
  var m=b.match(/([\d.]+)\s*mm/);
  return m?Math.max(2,Math.min(240,parseFloat(m[1]))):15;
}
function blocksHtml(){
  var h="";
  for(var i=0;i<S.blocks.length;i++){
    var b=S.blocks[i],k=blockKind(b),body;
    if(k==="pbreak")body='<div class="pb"><span class="lbl">Page break</span></div>';
    else if(k==="spacer"){var mm=spacerMm(b);
      body='<div class="sp" style="height:'+mm+'mm"><span class="lbl">Spacer &middot; '+mm+'&thinsp;mm</span></div>';}
    else body=renderBlock(b);
    h+='<div class="blk'+(k?" "+k:"")+'" data-i="'+i+'">'+
      '<span class="grip" data-grip aria-hidden="true">&equiv;</span>'+
      '<button class="addb top" data-add="before" aria-label="Add block above">+</button>'+
      '<button class="addb bot" data-add="after" aria-label="Add block below">+</button>'+
      '<button class="delb" data-del aria-label="Delete block">&times;</button>'+
      body+"</div>";
  }
  return h;
}
/* Consecutive picture blocks with different alignments (left, centre, right)
   sit side by side whenever their widths fit the column together. They stay
   separate blocks - each is only turned into an inline box and nudged to the
   place its alignment asks for - so editing, selecting and reordering are
   untouched. Runs on blocks that are still direct children of the sheet. */
var rowSeq=0;
function layoutRows(sheet){
  var blks=[].slice.call(sheet.querySelectorAll(":scope>.blk"));
  function alignOf(b){
    var im=b.querySelector(".img"),a="";
    try{a=String(JSON.parse(im.getAttribute("data-at")||"{}").align||"").toLowerCase()}catch(e){}
    return a==="left"||a==="right"?a:"center";
  }
  function flush(g,W){
    if(g.length<2)return;
    var by={},id="r"+(++rowSeq),nat=0;
    g.forEach(function(it){by[it.a]=it});
    var lw=by.left?by.left.w:0,rw=by.right?by.right.w:0;
    g.forEach(function(it){
      var x=it.a==="left"?0:it.a==="right"?W-it.w:(W-it.w)/2;
      /* a centred picture that would touch a neighbour takes the middle of the gap instead */
      if(it.a==="center"&&(x<lw||x+it.w>W-rw))x=lw+(W-lw-rw-it.w)/2;
      it.b.classList.add("inrow");it.b.dataset.row=id;
      it.b.style.width=(it.w/W*100)+"%";
      it.b.style.left=((x-nat)/W*100)+"%";
      nat+=it.w;
    });
  }
  var g=[],sum=0,W=0;
  blks.forEach(function(b){
    var im=b.classList.contains("imgblk")?b.querySelector(".img"):null;
    var w=im?im.getBoundingClientRect().width:0,bw=b.getBoundingClientRect().width;
    if(!im||w<1||bw<1){flush(g,W);g=[];sum=0;return}
    var a=alignOf(b);
    if(g.length&&(sum+w>W+.5||g.some(function(it){return it.a===a}))){flush(g,W);g=[];sum=0}
    if(!g.length)W=bw;
    g.push({b:b,w:w,a:a});sum+=w;
  });
  flush(g,W);
}
var storeSig="";
function syncStore(){
  var src=$('script[type="text/manu"]');
  if(!src){
    src=document.createElement("script");src.type="text/manu";
    document.head.insertBefore(src,document.head.firstChild);
  }
  var md="\n"+esc4save(S.md)+"\n";
  if(src.textContent!==md)src.textContent=md;
  var sig=Object.keys(S.assets).map(function(n){return n+":"+S.assets[n].length}).join("|");
  if(sig!==storeSig){storeSig=sig;$("#manu-assets").textContent=JSON.stringify(S.assets)}
  var st=JSON.stringify(Object.assign({},S.settings,{view:"digital"}));
  if($("#manu-settings").textContent!==st)$("#manu-settings").textContent=st;
}
function render(){
  S.blocks=splitBlocks(S.md);
  histRecord();
  syncStore();
  var sheet=$("#sheet");
  sheet.innerHTML=blocksHtml()+'<div id="ghost">&para; &nbsp;Tap to write</div>';
  var pages=1;
  layoutRows(sheet);
  if(S.settings.view==="pages")pages=paginate(sheet);
  var t=(S.md.match(/^#\s+(.+)$/m)||[])[1];
  document.title=t?t+" \u00b7 manu":"manu";
  var pc=$("#pagecount");
  if(pc)pc.textContent=S.settings.view==="pages"
    ?" \u00b7 "+pages+(pages===1?" page":" pages")
    :" \u00b7 digital";
  applySel();
  if(S.settings.view==="pages")refreshPreview();
  else scheduleEditorHQ();
}
function paginate(sheet){
  var doc=sheet.ownerDocument;
  var ghost=sheet.querySelector("#ghost");if(ghost)ghost.remove();
  var blks=[].slice.call(sheet.querySelectorAll(".blk"));
  sheet.innerHTML="";
  var pages=[];
  function newPage(forced){
    var p=doc.createElement("div");p.className="page";
    if(forced)p.dataset.forced="1";
    sheet.appendChild(p);pages.push(p);return p;
  }
  var pg=newPage(false);
  blks.forEach(function(b){
    if(b.classList.contains("pbreak")&&pg.childElementCount)pg=newPage(true);
    pg.appendChild(b);
  });
  /* a row of pictures moves to the next page as one piece */
  function tail(p){
    var el=p.lastElementChild,out=[el],row=el.dataset.row;
    if(row)while((el=el.previousElementSibling)&&el.dataset.row===row)out.push(el);
    return out;
  }
  var i=0,guard=0;
  while(i<pages.length&&guard++<500){
    var p=pages[i],t;
    while(p.scrollHeight>p.clientHeight+1&&p.querySelectorAll(":scope>.blk").length>(t=tail(p)).length){
      var next=pages[i+1];
      if(!next||next.dataset.forced==="1"){
        var np=doc.createElement("div");np.className="page";
        sheet.insertBefore(np,next||null);
        pages.splice(i+1,0,np);
        next=np;
      }
      t.forEach(function(el){next.insertBefore(el,next.firstChild)});
    }
    i++;
  }
  var last=pages[pages.length-1];
  if(ghost)last.appendChild(ghost);
  if(last.scrollHeight>last.clientHeight+1&&ghost){
    var np2=doc.createElement("div");np2.className="page";np2.appendChild(ghost);
    sheet.appendChild(np2);pages.push(np2);
  }
  pages.forEach(function(p,n){
    var tag=doc.createElement("span");tag.className="pagenum";
    tag.textContent=(n+1)+" / "+pages.length;p.appendChild(tag);
  });
  return pages.length;
}

/* ---------- block editing ---------- */
var editing=null;
function grow(ta){ta.style.height="auto";ta.style.height=ta.scrollHeight+"px"}
function openEditor(i,el,caret,insert){
  if(S.mode!=="edit")return;
  commitOpen();
  document.body.classList.add("editing");
  var ta=document.createElement("textarea");
  ta.value=(!insert&&i<S.blocks.length)?S.blocks[i]:"";
  el.innerHTML="";el.appendChild(ta);
  editing={i:i,ta:ta,cancel:false,insert:!!insert};
  ta.addEventListener("input",function(){grow(ta);S.dirty=true});
  ta.addEventListener("keydown",function(e){
    if(!e.isComposing&&(e.ctrlKey||e.metaKey)&&e.key==="Enter"){
      e.preventDefault();e.stopPropagation();commitOpen();return;
    }
    if(e.key==="Escape"){editing.cancel=true;ta.blur()}
  });
  ta.addEventListener("blur",function(){setTimeout(commitOpen,0)});
  grow(ta);ta.focus();
  if(caret==="end")ta.setSelectionRange(ta.value.length,ta.value.length);
}
function commitOpen(){
  document.body.classList.remove("editing");
  if(!editing)return;
  var e=editing;editing=null;
  if(e.cancel){render();return}
  var v=e.ta.value.replace(/\s+$/,"");
  if(e.insert){if(v)S.blocks.splice(e.i,0,v)}
  else if(e.i>=S.blocks.length){if(v)S.blocks.push(v)}
  else if(v==="")S.blocks.splice(e.i,1);
  else S.blocks[e.i]=v;
  sel=(v==="")?null:Math.min(e.i,S.blocks.length-1);
  if(!S.blocks.length)sel=null;
  S.md=S.blocks.join("\n\n");S.dirty=true;
  render();
}
/* ---------- selection ---------- */
var sel=null;
function applySel(){
  [].slice.call($("#sheet").querySelectorAll(".blk.sel")).forEach(function(b){b.classList.remove("sel")});
  if(sel==null)return;
  var b=$("#sheet").querySelector('.blk[data-i="'+sel+'"]');
  if(b)b.classList.add("sel");else sel=null;
}
function select(i){sel=i;applySel()}
function deselect(){if(sel==null)return;sel=null;applySel()}
var lastTap={i:-1,t:0};
$("#sheet").addEventListener("click",function(ev){
  if(S.mode!=="edit")return;
  if(ev.target.tagName==="TEXTAREA")return;
  if(ev.target.closest(".grip"))return;
  var del=ev.target.closest(".delb");
  if(del){
    ev.stopPropagation();
    removeBlock(+del.closest(".blk").dataset.i);
    return;
  }
  var add=ev.target.closest(".addb");
  if(add){
    var ab=add.closest(".blk");
    ev.stopPropagation();
    insertBlock(add.dataset.add==="before"?+ab.dataset.i:+ab.dataset.i+1);
    return;
  }
  var g=ev.target.closest("#ghost");
  if(g){deselect();openEditor(S.blocks.length,g,"end");return}
  var blk=ev.target.closest(".blk");
  if(!blk){deselect();return}
  if(blk.querySelector("textarea"))return;
  var i=+blk.dataset.i,now=Date.now();
  var dbl=(lastTap.i===i&&now-lastTap.t<350);
  lastTap={i:i,t:now};
  if(dbl){lastTap={i:-1,t:0};closePop();select(i);openEditor(i,blk,"end");return}

var IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||
  (navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function openBlob(url){
  var a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";
  document.body.appendChild(a);a.click();a.remove();
}
function handoff(blob,url){
  var file=null;
  try{file=new File([blob],fileTitle()+".pdf",{type:"application/pdf"})}catch(e){}
  var canShare=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}));
  modal("<h3>PDF ready</h3><p>"+
    (canShare?"Share opens your device sheet &mdash; Print, AirDrop and Save all live there."
             :"Open shows the PDF in your device&rsquo;s viewer, where the print and share options live.")+"</p>"+
    "<div class='row'><button data-a='x'>Cancel</button><button data-a='dl'>Download</button>"+
    "<button class='primary' data-a='go'>"+(canShare?"Share":"Open")+"</button></div>",
    function(a){
      if(a==="dl"){var el=document.createElement("a");el.href=url;el.download=fileTitle()+".pdf";
        document.body.appendChild(el);el.click();el.remove()}
      if(a==="go"){
        if(canShare)navigator.share({files:[file],title:fileTitle()}).catch(function(){openBlob(url)});
        else openBlob(url);
      }
    });
}
function printPdf(){
  commitOpen();
  toast("Preparing PDF\u2026");
  buildPdf().then(function(blob){
    hideToast();
    var url=URL.createObjectURL(blob);
    if(IOS){handoff(blob,url);return}
    var old=document.getElementById("printframe");if(old)old.remove();
    var f=document.createElement("iframe");
    f.id="printframe";f.setAttribute("aria-hidden","true");
    f.style.cssText="position:fixed;right:0;bottom:0;width:1px;height:1px;opacity:0;border:0;pointer-events:none";
    var done=false;
    f.onload=function(){
      if(done)return;done=true;
      setTimeout(function(){
        try{f.contentWindow.focus();f.contentWindow.print()}catch(e){handoff(blob,url)}
      },300);
    };
    f.src=url;
    document.body.appendChild(f);
    setTimeout(function(){if(!done){done=true;handoff(blob,url)}},5000);
    setTimeout(function(){URL.revokeObjectURL(url)},180000);
  }).catch(function(){hideToast();alert("Could not build the PDF.")});
}

      modal("<h3>Optimize images</h3><p>This document has no embedded pictures to optimize.</p>"+
        "<div class='row'><button class='primary' data-a='x'>Close</button></div>");
      return;
    }
    var base=baseFileBytes(),origTotal=0;
    list.forEach(function(it){origTotal+=it.orig});
    modal("<h3>Optimize images</h3>"+
      "<p>"+list.length+" picture"+(list.length>1?"s":"")+" &middot; currently "+fmtSize(origTotal)+
      " of a "+fmtSize(base+origTotal)+" file. Undo restores the originals.</p>"+
      "<button class='optrow busy' data-a='fit'><span>Screen &amp; print"+
        "<em>300 dpi at the placed size &middot; crops are baked in</em></span><b id='szFit'>measuring</b></button>"+
      "<button class='optrow busy' data-a='archive'><span>Archive"+
        "<em>600 dpi within 30 cm &middot; crops stay adjustable</em></span><b id='szArc'>measuring</b></button>"+
      "<button class='optrow' data-a='keep'><span>Keep originals"+
        "<em>no change</em></span><b>"+fmtSize(base+origTotal)+"</b></button>"+
      "<div class='row'><button data-a='x'>Cancel</button></div>",
      function(a){
        if(a==="fit"||a==="archive")applyOptimize(list,a);
      });
    measureTiers(list,base);
  }).catch(function(){
    modal("<h3>Optimize images</h3><p>Could not read the pictures in this document.</p>"+
      "<div class='row'><button class='primary' data-a='x'>Close</button></div>");
  });
}
function measureTiers(list,base){
  if(OPT.running)return;
  OPT.running=true;
  var totals={fit:base,archive:base},done={fit:0,archive:0};
  var chain=Promise.resolve();
  list.forEach(function(it){
    chain=chain.then(function(){
      return loadImg(it.uri).then(function(img){
        var alpha=uriHasAlpha(img,uriMime(it.uri));
        ["fit","archive"].forEach(function(t){
          var key=it.name+"|"+t+"|"+Math.round(it.disp)+"|"+(it.crop?"c":"");
          var out=OPT.cache[key]||(OPT.cache[key]=encodeTier(img,t,it.disp,alpha,it.crop));
          /* never make a picture bigger than it already is */
          totals[t]+=Math.min(out.length,it.orig);
          done[t]++;
        });
        var f=$("#szFit"),a=$("#szArc");
        if(f)f.textContent="~"+fmtSize(totals.fit);
        if(a)a.textContent="~"+fmtSize(totals.archive);
      }).catch(function(){});
    });
  });
  chain.then(function(){
    OPT.running=false;
    var f=$("#szFit"),a=$("#szArc");
    if(f){f.textContent=fmtSize(totals.fit);f.parentNode.classList.remove("busy")}
    if(a){a.textContent=fmtSize(totals.archive);a.parentNode.classList.remove("busy")}
  });
}
function applyOptimize(list,tier){
  var before=0,after=0,flat=[],chain=Promise.resolve();
  list.forEach(function(it){
    before+=it.orig;
    chain=chain.then(function(){
      return loadImg(it.uri).then(function(img){
        var alpha=uriHasAlpha(img,uriMime(it.uri));
        var key=it.name+"|"+tier+"|"+Math.round(it.disp)+"|"+(it.crop?"c":"");
        var out=OPT.cache[key]||(OPT.cache[key]=encodeTier(img,tier,it.disp,alpha,it.crop));
        var baked=(tier==="fit"&&it.crop);
        if(out&&(out.length<it.orig||baked)){
          S.assets[it.name]=out;after+=out.length;
          if(baked)flat.push(it.name);
        }else after+=it.orig;
      }).catch(function(){after+=it.orig});
    });
  });
  chain.then(function(){
    /* a baked crop IS the picture now - drop the crop attributes */
    if(flat.length){
      S.blocks=splitBlocks(S.md);
      flat.forEach(function(n){
        var esc=n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
        var re=new RegExp("(!\\[[^\\]]*\\]\\("+esc+"\\))(\\{([^}]*)\\})?","g");
        S.md=S.md.replace(re,function(_,head,__,attrs){
          var a=parseAttrs(attrs||"");
          delete a.z;delete a.x;delete a.y;
          return head+attrsToStr(a);
        });
      });
      S.blocks=splitBlocks(S.md);
    }
    S.dirty=true;PV.L=null;PV.key=null;layoutCache={key:null,data:null};
    render();
    var saved=before-after;
    toast(saved>0?("Images optimized \u00b7 "+fmtSize(saved)+" smaller"):"Images already optimal",undo);
  });
}

/* ---------- save (self-serialization) ---------- */
function fileTitle(){
  var t=(S.md.match(/^#\s+(.+)$/m)||[])[1]||"document";
  return t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60)||"document";
}
/* which assets the document actually references */
function usedAssetNames(){
  var used={},re=/!\[[^\]]*\]\(([^)\s]+)\)/g,m;
  while((m=re.exec(S.md)))used[m[1]]=1;
  return used;
}
function saveFile(ext){
  commitOpen();
  /* keep the extension the file was opened with */
  if(!ext)ext=/\.html?$/i.test(location.pathname)?"html":"manu";
  /* orphaned images (deleted blocks, replaced pictures) never reach the file.
     S.assets itself is left alone so undo can still bring them back. */
  var used=usedAssetNames(),keep={},dropped=0;
  Object.keys(S.assets).forEach(function(n){
    if(used[n])keep[n]=S.assets[n];else dropped++;
  });
  $("#manu-assets").textContent=JSON.stringify(keep);
  $("#manu-settings").textContent=JSON.stringify(Object.assign({},S.settings,{view:"digital"}));
  var clone=document.documentElement.cloneNode(true);
  var kill=clone.querySelector('script[type="text/manu"]');if(kill)kill.remove();
  clone.querySelectorAll(".pop").forEach(function(n){n.remove()});
  /* Chrome's translator injects its own UI; never let it into a saved file */
  clone.querySelectorAll('.skiptranslate,[id^="goog-"],[class^="goog-"],iframe.goog-te-banner-frame')
    .forEach(function(n){n.remove()});
  clone.querySelectorAll("font").forEach(function(n){
    while(n.firstChild)n.parentNode.insertBefore(n.firstChild,n);
    n.remove();
  });
  var sheet=clone.querySelector("#sheet");if(sheet)sheet.innerHTML="";
  var veil=clone.querySelector("#veil");if(veil)veil.hidden=true;
  var ff=clone.querySelector("#manu-fontface");if(ff)ff.remove();
  var sf=clone.querySelector("#stageframe");if(sf)sf.remove();
  var pf=clone.querySelector("#printframe");if(pf)pf.remove();
  var tt=clone.querySelector("#toast");if(tt)tt.remove();
  var pv=clone.querySelector("#pdfview");if(pv){pv.hidden=true;var ph=pv.querySelector("#pvpages");if(ph)ph.innerHTML=""}
  clone.setAttribute("data-view","digital");
  var bd=clone.querySelector("body");
  if(bd){bd.classList.remove("editing","full","idle");bd.setAttribute("data-view","digital");bd.setAttribute("data-mode","edit")}
  storeSig="";syncStore();                  /* the live page keeps every asset, for undo */
  /* the byte-order mark pins UTF-8 however long the source block ahead of <head> grows */
  var out="\ufeff<!doctype html>\n"+'<script type="text/manu">\n'+esc4save(S.md)+"\n<\/script>\n"+clone.outerHTML;
  download(fileTitle()+(ext==="html"?".html":".manu"),new Blob([out],{type:"text/html"}));
  S.dirty=false;
  if(dropped)toast(dropped+" unused image"+(dropped>1?"s":"")+" left out of the saved file");
}
function download(name,blob){
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
}
function dataURIBytes(u){
  var bin=atob(u.split(",")[1]),arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return arr.buffer;
}
function dataURItoBlob(u){
  var p=u.split(","),mime=(p[0].match(/data:([^;]+)/)||[])[1]||"application/octet-stream";
  var bin=atob(p[1]),arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
window.addEventListener("beforeunload",function(e){if(S.dirty){e.preventDefault();e.returnValue=""}});

/* ---------- open ---------- */
$("#fileOpen").addEventListener("change",function(){
  var f=this.files[0];this.value="";
  if(!f)return;
  var n=f.name.toLowerCase();
  if(/\.zip$/.test(n))return openZip(f);
  var rd=new FileReader();
  rd.onload=function(){
    var t=rd.result;
    if(/\.(manu|html?)$/.test(n))importManu(t);
    else{S.md=t;S.assets={};S.dirty=true;render()}
  };
  rd.readAsText(f);
});
function importManu(text){
  var m=text.match(/<script[^>]*type=["']text\/manu["'][^>]*>([\s\S]*?)<\/script>/i);
  if(!m){alert("No manu block found in that file.");return}
  S.md=unesc(m[1]).replace(/^\n+|\n+$/g,"");
  var a=text.match(/<script[^>]*id=["']manu-assets["'][^>]*>([\s\S]*?)<\/script>/i);
  try{S.assets=a?JSON.parse(a[1]):{}}catch(e){S.assets={}}
  var st=text.match(/<script[^>]*id=["']manu-settings["'][^>]*>([\s\S]*?)<\/script>/i);
  try{if(st)Object.assign(S.settings,JSON.parse(st[1]))}catch(e){}
  applyFonts();S.dirty=true;render();
}

/* ---------- zip: read ---------- */
function openZip(file){
  file.arrayBuffer().then(function(buf){
    var dv=new DataView(buf),i=buf.byteLength-22;
    while(i>=0&&dv.getUint32(i,true)!==0x06054b50)i--;
    if(i<0){alert("Could not read that zip.");return}
    var count=dv.getUint16(i+10,true),off=dv.getUint32(i+16,true),p=off,jobs=[];
    for(var k=0;k<count;k++){
      if(dv.getUint32(p,true)!==0x02014b50)break;
      var method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),
          nlen=dv.getUint16(p+28,true),elen=dv.getUint16(p+30,true),clen=dv.getUint16(p+32,true),
          lho=dv.getUint32(p+42,true),
          name=new TextDecoder().decode(new Uint8Array(buf,p+46,nlen));
      if(!/\/$/.test(name))jobs.push({name:name,method:method,csize:csize,lho:lho});
      p+=46+nlen+elen+clen;
    }
    Promise.all(jobs.map(function(j){
      var ln=dv.getUint16(j.lho+26,true),le=dv.getUint16(j.lho+28,true);
      var data=buf.slice(j.lho+30+ln+le,j.lho+30+ln+le+j.csize);
      if(j.method===0)return Promise.resolve({name:j.name,buf:data});
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw")))
        .arrayBuffer().then(function(b){return {name:j.name,buf:b}});
    })).then(function(files){ingestFiles(files)})
      .catch(function(){alert("Could not unpack that zip.")});
  });
}
function b64(buf){
  var u=new Uint8Array(buf),s="",CH=0x8000;
  for(var i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,i+CH));
  return btoa(s);
}
function mimeOf(name){
  var e=name.toLowerCase().split(".").pop();
  return {png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",svg:"image/svg+xml"}[e];
}
function ingestFiles(files){
  var md=null,assets={};
  files.forEach(function(f){
    var base=f.name.split("/").pop();
    if(/\.(md|markdown)$/i.test(base)&&md===null)md=new TextDecoder().decode(f.buf);
    else{var mm=mimeOf(base);if(mm)assets[safeNameIn(assets,base)]="data:"+mm+";base64,"+b64(f.buf)}
  });
  if(md===null&&!Object.keys(assets).length){alert("No markdown or images found.");return}
  if(md!==null){S.md=md.replace(/^\n+|\n+$/g,"");S.assets=assets}
  else{Object.assign(S.assets,assets);Object.keys(assets).forEach(function(n){S.blocks.push("!["+n+"]("+n+")")});S.md=S.blocks.join("\n\n")}
  S.dirty=true;render();
}
function safeNameIn(map,n){
  n=n.replace(/[^A-Za-z0-9._-]/g,"_");var base=n,i=2;
  while(map[n]||S.assets[n]){var d=base.lastIndexOf(".");n=(d>0?base.slice(0,d)+"-"+i+base.slice(d):base+"-"+i);i++}
  return n;
}

/* ---------- zip: write (STORE) ---------- */
var CRC=(function(){var t=[],c,n,k;for(n=0;n<256;n++){c=n;for(k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){var c=0xFFFFFFFF;for(var i=0;i<u.length;i++)c=CRC[(c^u[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipBlob(files){
  var parts=[],central=[],offset=0;
  files.forEach(function(f){
    var enc2=new TextEncoder();
    var nb=enc2.encode(f.name),crc=crc32(f.bytes),sz=f.bytes.length;
    var lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(8,0,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);
    lh.setUint16(26,nb.length,true);
    parts.push(lh.buffer,nb,f.bytes);
    var ce=new DataView(new ArrayBuffer(46));
    ce.setUint32(0,0x02014b50,true);ce.setUint16(4,20,true);ce.setUint16(6,20,true);
    ce.setUint32(16,crc,true);ce.setUint32(20,sz,true);ce.setUint32(24,sz,true);
    ce.setUint16(28,nb.length,true);ce.setUint32(42,offset,true);
    central.push(ce.buffer,nb);
    offset+=30+nb.length+sz;
  });
  var cdSize=central.reduce(function(a,b){return a+(b.byteLength||b.length)},0);
  var end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);
  end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);
  return new Blob(parts.concat(central,[end.buffer]),{type:"application/zip"});
}
function exportZip(){
  commitOpen();
  var enc=new TextEncoder();
  var files=[{name:"document.md",bytes:enc.encode(S.md)}];
  Object.keys(S.assets).forEach(function(n){
    files.push({name:n,bytes:new Uint8Array(dataURIBytes(S.assets[n]))});
  });
  download(fileTitle()+"-source.zip",zipBlob(files));
}

/* ---------- drag & drop ---------- */
var dragDepth=0;
window.addEventListener("dragover",function(e){e.preventDefault()});
window.addEventListener("dragenter",function(e){e.preventDefault();dragDepth++;$("#drophint").hidden=false});
window.addEventListener("dragleave",function(){if(--dragDepth<=0){dragDepth=0;$("#drophint").hidden=true}});
window.addEventListener("drop",function(e){
  e.preventDefault();dragDepth=0;$("#drophint").hidden=true;
  var items=e.dataTransfer.items,entries=[];
  if(items&&items.length&&items[0].webkitGetAsEntry){
    for(var i=0;i<items.length;i++){var en=items[i].webkitGetAsEntry();if(en)entries.push(en)}
    walkEntries(entries).then(function(files){routeDropped(files)});
  }else{
    routeDropped([].slice.call(e.dataTransfer.files));
  }
});
function walkEntries(entries){
  var out=[];
  function walk(en){
    return new Promise(function(res){
      if(en.isFile)en.file(function(f){out.push(f);res()},res);
      else if(en.isDirectory){
        var r=en.createReader();
        r.readEntries(function(list){Promise.all(list.map(walk)).then(res)},res);
      }else res();
    });
  }
  return Promise.all(entries.map(walk)).then(function(){return out});
}
function routeDropped(files){
  var zip=files.find(function(f){return /\.zip$/i.test(f.name)});
  if(zip)return openZip(zip);
  var manu=files.find(function(f){return /\.(manu|html?)$/i.test(f.name)});
  if(manu){var r=new FileReader();r.onload=function(){importManu(r.result)};r.readAsText(manu);return}
  var md=files.find(function(f){return /\.(md|markdown)$/i.test(f.name)});
  var imgs=files.filter(function(f){return /^image\//.test(f.type)});
  if(md){
    var rd=new FileReader();
    rd.onload=function(){
      S.md=rd.result.replace(/^\n+|\n+$/g,"");S.assets={};
      if(imgs.length)addImageAssetsOnly(imgs);else{S.dirty=true;render()}
    };
    rd.readAsText(md);
  }else if(imgs.length)addImageFiles(imgs,null);
}
function addImageAssetsOnly(files){
  var done=0;
  files.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(){S.assets[safeName(f.name)]=rd.result;if(++done===files.length){S.dirty=true;render()}};
    rd.readAsDataURL(f);
  });
}

/* ---------- boot ---------- */
markNoTranslate();
loadSelf();
applyView();
render();
fontsP=loadFonts().then(function(){render()});
})();
</script>
